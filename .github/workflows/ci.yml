name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: .venv/bin/ruff check backend scripts
      - run: .venv/bin/ruff format --check backend scripts
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: .venv/bin/python scripts/generate_examples.py
      - run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
